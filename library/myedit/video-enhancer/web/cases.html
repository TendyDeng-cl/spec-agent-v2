<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Enhancer V2 Test Cases · Web</title>
<!-- tab icon (review: a checklist), different on each page so the browser tabs are easy to tell apart -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%233d5bd9'/><path d='M7 10.5l2.5 2.5L14 8.5M7 20.5l2.5 2.5 4.5-4.5' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/><path d='M17.5 11h8M17.5 21h8' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;650;750&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;600;700&display=swap">
<style>
/* Shared by every casebook page (scripts/lib/page-shared.ts puts it at the top of each page's <style>): one palette and
   one type scale, and the time and usage strip of Progress and Design. A page's own rules come after and may override. */
:root {
  --bg: #f4f6f6; --panel: #ffffff; --ink: #172426; --muted: #5b6b6e; --line: #d8e0e1; --accent: #0f6e73; --chip-bg: #eef2f2;
  --pass: #2f7d4f; --fail: #b8402f; --blocked: #a86b12; --inc: #6a55a8; --notrun: #9aa6a8; --hold: #7a5a14; --skip: #7d878a;
  --differs: #b8402f; --question: #a86b12; --unreviewed: #6a55a8; --matches: #2f7d4f; --none: #9aa6a8; --info: #2c6fa8;
  --display: "Archivo", "Noto Sans TC", "Helvetica Neue", Arial, sans-serif;
  --body: "Source Sans 3", "Noto Sans TC", "Segoe UI", system-ui, "PingFang TC", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  /* one page width and side gutter on every tab (user, 2026-11-06) */
  --gutter: max(16px, env(safe-area-inset-left, 0px), calc((100vw - 1280px) / 2));
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111a1b; --panel: #182325; --ink: #e3ecec; --muted: #93a5a7; --line: #2a3a3c; --accent: #4fb8bd; --chip-bg: #213032;
  --pass: #5cbf83; --fail: #ec7a66; --blocked: #e0a548; --inc: #a796e0; --notrun: #5f6f71; --hold: #e0b85a; --skip: #8c9a9c;
  --differs: #ec7a66; --question: #e0a548; --unreviewed: #a796e0; --matches: #5cbf83; --none: #5f6f71; --info: #74b3ea; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111a1b; --panel: #182325; --ink: #e3ecec; --muted: #93a5a7; --line: #2a3a3c; --accent: #4fb8bd; --chip-bg: #213032;
  --pass: #5cbf83; --fail: #ec7a66; --blocked: #e0a548; --inc: #a796e0; --notrun: #5f6f71; --hold: #e0b85a; --skip: #8c9a9c;
  --differs: #ec7a66; --question: #e0a548; --unreviewed: #a796e0; --matches: #5cbf83; --none: #5f6f71; --info: #74b3ea; color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); margin: 0; padding-inline: var(--gutter) }
/* the tab bar still spans the window, also after a resize */
.cb-tabs { margin-left: calc(-1 * var(--gutter)) !important; margin-right: calc(-1 * var(--gutter)) !important; padding-inline: var(--gutter) !important }
/* Time and usage: stays at the top of the page, readable at a glance (user, 2026-11-06). One figure per tile, the
   estimate first; the account's shared total stays muted (AGENTS.md, Plan usage). */
.ubox { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px 14px; display: grid; gap: 10px; min-width: 0 }
.ubox .uh { display: flex; gap: 4px 12px; align-items: baseline; flex-wrap: wrap }
.ubox .uh h2 { font: 700 1.05rem var(--display); margin: 0; letter-spacing: -0.01em }
.ubox .uh .uw { color: var(--muted); font-size: 0.86rem }
.ubox .ulive { font: 600 0.75rem var(--body); color: var(--pass); display: inline-flex; gap: 5px; align-items: center }
.ubox .ulive i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: cbpulse 1.6s ease-in-out infinite }
@keyframes cbpulse { 50% { opacity: 0.25 } }
@media (prefers-reduced-motion: reduce) { .ubox .ulive i { animation: none } }
.ustrip { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px }
.ut { background: var(--chip-bg); border-radius: 6px; padding: 8px 12px 10px; display: grid; gap: 2px; align-content: start; min-width: 0 }
.ut .ul { font-size: 0.82rem; color: var(--muted) }
.ut .uv { font: 700 1.55rem/1.2 var(--display); font-variant-numeric: tabular-nums }
.ut .uv.est { color: var(--accent) }
.ut .us { font-size: 0.84rem; color: var(--muted) }
.ut .um { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: color-mix(in srgb, var(--muted) 22%, transparent); margin-top: 5px }
.ut .um span { display: block; height: 100%; background: var(--accent) }
.ut .um span.idle { background: color-mix(in srgb, var(--muted) 45%, transparent) }
.ut.acct .uv { font-size: 1.05rem; font-weight: 600; color: var(--muted); line-height: 1.5 }
.ubox .unone { color: var(--muted); font-style: italic }
.ubox .ufoot { display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: center }
.ubox details.how summary { cursor: pointer; font-size: 0.85rem; color: var(--muted) }
.ubox .notes { color: var(--muted); font-size: 0.85rem; margin: 8px 0 0; display: grid; gap: 4px }

/* Layout: a spreadsheet-like review sheet — header facts, filter bar, rows grouped by section, sticky action bar. */
:root{
  --surface:var(--panel); --fg:var(--ink);
  --new:#1f7a4d; --new-soft:#dff3e8; --mod:#9a5b00; --mod-soft:#fbecd2; --rem:#b3261e; --rem-soft:#fadcd9; --edit:#3d5bd9; --edit-soft:#e2e7fb;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --new:#5cc58e; --new-soft:#173a29; --mod:#e7a94a; --mod-soft:#3b2c12; --rem:#f07a70; --rem-soft:#3e1d1a; --edit:#93a6ff; --edit-soft:#232c55}}
header{padding:28px 0 4px;display:grid;gap:8px}
header h1{margin:0;font:750 1.9rem var(--display);letter-spacing:-.01em}
header .facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.92rem;color:var(--muted)}
header .facts code{font-family:var(--mono);font-size:.8rem}
main{padding:16px 0 110px;display:grid;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
details.panel>summary{cursor:pointer;padding:10px 14px;font-weight:600}
details.panel .md{padding:0 14px 14px;max-height:460px;overflow:auto;font-size:13px}
.md h2,.md h3,.md h4{margin:12px 0 4px;font-size:.95rem}
.md ul{margin:4px 0;padding-left:18px}
.md table{min-width:0;width:auto;border-collapse:collapse;margin:6px 0}
.md td,.md th{border:1px solid var(--line);padding:4px 8px;position:static;text-transform:none;letter-spacing:0;font:13px var(--body);color:var(--fg)}
.md code{font-family:var(--mono);font-size:.85em}
details.panel pre{margin:0;padding:0 14px 14px;white-space:pre-wrap;font:13px/1.55 var(--body);max-height:420px;overflow:auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:4px 10px;font:500 .82rem var(--body);cursor:pointer}
.chip b{font-family:var(--mono);color:var(--muted);margin-left:3px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip[aria-pressed="true"] b{color:var(--bg)}
input[type=search],select{font:inherit;padding:5px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
input[type=search]{flex:1 1 220px;min-width:0}
.sep{width:1px;height:22px;background:var(--line)}
/* the sheet scrolls inside its own box, so the header row, ID and Decision stay in view both ways (user, 2026-11-06) */
.tablewrap{overflow:auto;max-height:calc(100vh - 96px)}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1150px;background:var(--surface)}
table.slim{min-width:760px}
table.slim th:nth-child(2){width:24%}table.slim th:nth-child(3){width:32%}table.slim th:nth-child(4){width:34%}
table.slim th:nth-child(n+5):nth-child(-n+7),table.slim tr[data-row]>td:nth-child(n+5):nth-child(-n+7){display:none}
td.id,th:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
td.dec,#decHead{position:sticky;right:0;background:var(--surface);z-index:1}
th:first-child,#decHead{z-index:3}
.cv{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.45;padding:4px;border-radius:4px;min-height:1.9em;border:1px solid transparent}
body:not(.view) .cv{cursor:text} body:not(.view) .cv:hover,.cv:focus-visible{border-color:var(--line);outline:none}
tr.deleted .cv{text-decoration:line-through}
#tip{position:fixed;z-index:20;max-width:300px;background:var(--fg);color:var(--bg);font:.82rem/1.35 var(--body);padding:4px 8px;border-radius:5px;pointer-events:none}
.colsw{font-size:.84rem;color:var(--muted);display:inline-flex;gap:5px;align-items:center}
th{position:sticky;top:0;background:var(--surface);z-index:2;text-align:left;font:600 .72rem var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:8px;border-bottom:2px solid var(--line)}
td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
tr.section td{background:var(--bg);font-weight:700;padding:10px 8px}
tr.section td .add{margin-left:10px}
td.id{font-family:var(--mono);font-size:.8rem;white-space:nowrap}
textarea{width:100%;min-height:2.2em;resize:vertical;border:1px solid transparent;background:transparent;color:var(--fg);font:14px/1.45 var(--body);padding:4px;border-radius:4px;field-sizing:content}
textarea:hover{border-color:var(--line)} textarea:focus{border-color:var(--edit);outline:none;background:var(--surface)}
.was{font-size:.76rem;color:var(--muted);text-decoration:line-through;padding:0 4px;white-space:pre-wrap}
.badge{display:inline-block;font:600 .68rem var(--mono);padding:2px 6px;border-radius:4px;text-transform:uppercase;margin-top:4px}
.b-new{background:var(--new-soft);color:var(--new)} .b-modified{background:var(--mod-soft);color:var(--mod)} .b-removed{background:var(--rem-soft);color:var(--rem)} .b-edited{background:var(--edit-soft);color:var(--edit)} .b-added{background:var(--new-soft);color:var(--new)}
.reason{font-size:.74rem;color:var(--muted);margin-top:3px;max-width:14em;white-space:normal;overflow-wrap:anywhere}
tr.deleted td:not(.dec){opacity:.45} tr.deleted textarea{text-decoration:line-through}
td.dec{white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--muted);font:600 .76rem var(--body);padding:4px 8px;cursor:pointer}
.seg button[aria-pressed="true"].k{background:var(--new);color:#fff} .seg button[aria-pressed="true"].d{background:var(--rem);color:#fff}
button:focus-visible,.chip:focus-visible{outline:2px solid var(--edit);outline-offset:2px}
.add{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:3px 8px;font:500 .78rem var(--body);cursor:pointer}
tr.newcase td{background:var(--new-soft);padding:10px 12px}
tr.newcase textarea.big{min-height:9em;border:1px solid var(--new);background:var(--surface);font-size:14px;padding:8px 10px;field-sizing:content}
tr.newcase .nh{display:flex;gap:10px;align-items:center;margin-bottom:6px;font-size:.84rem;color:var(--muted)}
tr.newcase .nh b{color:var(--new)} tr.newcase .nh button{margin-left:auto}
/* the table scrolls sideways: keep the note box within the window */
tr.newcase td>*{position:sticky;left:12px;max-width:calc(100vw - 72px)}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px var(--gutter);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;z-index:5}
footer .counts{font-size:.84rem;color:var(--muted)} footer .counts b{color:var(--fg)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:6px;font:600 .86rem var(--body);cursor:pointer}
.btn.primary{background:var(--edit);color:#fff;border-color:var(--edit)}
.btn:disabled{opacity:.5;cursor:not-allowed}
#toast{position:fixed;right:20px;bottom:70px;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:6px;font-size:.86rem;max-width:520px;display:none;z-index:6}
.note{font-size:.8rem;color:var(--muted)}
a.spec{display:inline-block;margin-top:4px;font:600 .7rem var(--mono);color:var(--edit);text-decoration:none;border:1px solid var(--edit-soft);border-radius:4px;padding:1px 5px}
a.spec:hover{background:var(--edit-soft)}
.xl{display:flex;flex-wrap:wrap;gap:4px}
/* Open questions (user, 2026-11-04): one plain panel above the table, and a marker on each row a question touches */
/* the summary keeps the browser's own marker, like the other panels; the wrapping layout is on the span inside */
details.qs>summary>.qsum{display:inline-flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;vertical-align:top}
details.qs>summary .qhint{font-weight:400;font-size:.84rem;color:var(--muted)}
.qwrap{padding:0 14px 14px;display:grid;gap:10px}
.qname{display:flex;gap:8px;align-items:center;font-size:.84rem;color:var(--muted)}
.qname input{font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
.qitem{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:6px}
.qitem.hit{box-shadow:0 0 0 2px var(--edit)}
.qhead{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-weight:600}
.qstate{font:600 .7rem var(--body);border-radius:999px;padding:2px 8px;background:var(--bg);color:var(--muted)}
.qstate.answered{background:var(--mod-soft);color:var(--mod)} .qstate.done{background:var(--new-soft);color:var(--new)}
.qtext{font-size:13px;white-space:pre-wrap}
.qassume{font-size:13px;color:var(--muted)} .qassume b{color:var(--fg);font-weight:600}
body.l-zh .qitem .qtext:not(.zh),body.l-zh .qitem .qassume:not(.zh){font-size:11.5px;color:var(--muted)} .qitem .zh.qassume{color:var(--fg)}
.qrows{font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.qrow{display:inline-flex;gap:4px;align-items:center} .qrow a.qcase{font-family:var(--mono);color:var(--edit)} .qrow a.spec{margin-top:0}
.qitem textarea{border:1px solid var(--line);background:var(--surface);min-height:3.2em;font-size:13.5px}
.qmeta{font-size:.76rem;color:var(--muted)} .qres{font-size:.8rem;color:var(--new)}
.qfoot{display:flex;gap:10px;align-items:center;justify-content:flex-end}
a.qmark{display:inline-block;margin-top:4px;font:600 .7rem var(--body);color:var(--mod);background:var(--mod-soft);border-radius:4px;padding:1px 6px;text-decoration:none}
a.qmark.answered{color:var(--edit);background:var(--edit-soft)} a.qmark.done{color:var(--new);background:var(--new-soft)}
tr.focus td{background:var(--edit-soft)} tr.focus td.id{box-shadow:inset 3px 0 0 var(--edit)}
/* 中文 mode: the Chinese reading copy above each English field; the English stays the editable source */
.zh{white-space:pre-wrap;font-size:13.5px;line-height:1.5;padding:4px;margin-bottom:2px}
.zh.stale{color:var(--muted)} .zh.stale::after{content:attr(data-stale);display:block;font-size:.72rem;color:var(--mod)}
body.l-zh td textarea[data-f]{font-size:11.5px;color:var(--muted);min-height:1.6em}
body.l-zh td textarea[data-f]:focus{font-size:13px;color:var(--fg)}
body.l-zh td .cv{font-size:11.5px;color:var(--muted);min-height:1.6em}
header .lang{justify-self:end;display:inline-flex;border:1px solid #ffffff55;border-radius:6px;overflow:hidden;margin-top:-34px}
header .lang button{border:0;background:transparent;color:#fff;font:600 12px var(--body);padding:5px 10px;cursor:pointer}
header .lang button[aria-pressed="true"]{background:var(--edit)}
</style>
</head>
<body>
<header>
  <h1 id="h"></h1>
  <div class="facts" id="facts"></div>
  <span class="lang" id="lang" role="group" aria-label="Language" hidden><button type="button" data-l="en">English</button><button type="button" data-l="zh">中文</button></span>
</header>
<main>
  <details class="panel qs" id="qBox" hidden><summary id="qSum"></summary><div class="qwrap" id="qList"></div></details>
  <details class="panel" id="planBox" hidden><summary data-i="plan">Update plan</summary><div class="md" id="plan"></div></details>
  <details class="panel" id="reqBox" hidden><summary data-i="req">Requirements extracted from the spec</summary><div class="md" id="req"></div></details>
  <div class="panel bar" id="filters"></div>
  <div class="panel tablewrap"><table id="tbl"><thead><tr><th data-i="ID">ID</th><th data-i="Precondition">Precondition</th><th data-i="Action">Action</th><th data-i="Expected Result">Expected Result</th><th data-i="Priority">Priority</th><th data-i="Spec Ref">Spec Ref</th><th data-i="Notes">Notes</th><th id="decHead" data-i="Decision">Decision</th></tr></thead><tbody></tbody></table></div>
  <p class="note" id="foot"></p>
</main>
<footer>
  <span class="counts" id="counts"></span>
  <span style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn" id="copyCsv" data-i="copyCsv">Copy final CSV</button>
    <button class="btn" id="copyDec" data-i="copyDec">Copy decisions</button>
    <button class="btn primary" id="save" data-i="save">Save as approved table</button>
  </span>
</footer>
<div id="toast" role="status"></div>
<script>
// Shared by the casebook pages (scripts/lib/page-shared.ts puts it at the top of each page's script).
// Times: every page shows Taipei time and says so (user, 2026-11-06), whatever the viewer's or the data's zone. Input is
// an ISO time or the pages' older `YYYY-MM-DD HH:mm UTC`.
const cbDate = s => { if (!s) return null; const d = new Date(/ UTC$/.test(s) ? String(s).replace(' UTC', 'Z').replace(' ', 'T') : s); return isNaN(d) ? null : d; };
const cbParts = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Taipei', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
const cbWhen = s => { const d = cbDate(s); if (!d) return String(s ?? ''); const p = Object.fromEntries(cbParts.formatToParts(d).map(x => [x.type, x.value])); return `${p.month}-${p.day} ${p.hour}:${p.minute}`; };
const cbZone = lang => lang === 'zh' ? '台北時間' : 'Taipei time';
const cbWhenZ = (s, lang) => s ? `${cbWhen(s)} ${cbZone(lang)}` : '';
const cbSpan = (a, b, lang) => `${cbWhen(a)} → ${cbWhen(b)} ${cbZone(lang)}`;
const cbEsc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const cbHm = ms => `${Math.floor(ms / 3600000)}h ${String(Math.round(ms / 60000) % 60).padStart(2, '0')}m`;
const cbTok = n => n >= 1e6 ? `${(n / 1e6).toFixed(1)}M` : n >= 1e3 ? `${Math.round(n / 1e3)}k` : String(n);
const cbPct = v => v < 9.95 ? `${v.toFixed(1)}%` : `${Math.round(v)}%`;
// The usage strip: time, tokens, the two estimates, then the account's shared total, muted. A seat other than 1× Pro
// also gets the estimate as a share of that seat, which is what the meter fills to.
// o: { wall, test, idle, gaps, tokens, tokensTitle, wt, est5, estW, noTokens, seat, acct5, acctW, approx, out5, outW, outLabel }
function cbUsageTiles(o, lang) {
  const zh = lang === 'zh', tx = (en, z) => zh ? z : en, m = o.seat && o.seat !== 1 ? o.seat : null;
  const pctA = v => v == null ? '—' : `${o.approx ? '≈' : ''}${Math.round(v)}%`;
  const est = (label, v, approx, title) => {
    const none = v == null ? `<span class="uv unone" style="font-size:1rem">${o.noTokens ? tx('no token data yet', '尚無 token 資料') : '—'}</span>` : '';
    const share = v != null && m ? v / m : v;
    return `<div class="ut" title="${cbEsc(title)}"><span class="ul">${label}</span>${none || `<span class="uv est">${approx ? '~' : ''}${cbPct(v)}</span>`}`
      + (v != null ? `<span class="us">${tx('of 1× Pro', '（1× Pro）')}${m ? tx(` · ${cbPct(share)} of the ${m}× seat`, ` · ${m}× 席位的 ${cbPct(share)}`) : ''}</span><span class="um"><span style="width:${Math.min(100, share)}%"></span></span>` : '') + '</div>';
  };
  const on = o.wall ? Math.min(100, o.test / o.wall * 100) : 0;
  return `<div class="ustrip">
    <div class="ut"><span class="ul">${tx('Test time', '測試時間')}</span><span class="uv">${cbHm(o.test)}</span>
      <span class="us">${tx(`of ${cbHm(o.wall)} wall`, `總時長 ${cbHm(o.wall)}`)}${o.idle ? tx(` · ${cbHm(o.idle)} idle`, ` · 閒置 ${cbHm(o.idle)}`) : ''}${o.gaps ? tx(` (${o.gaps} gap${o.gaps > 1 ? 's' : ''})`, `（${o.gaps} 段）`) : ''}</span>
      <span class="um" title="${cbEsc(tx('Test time against idle time', '測試時間與閒置時間'))}"><span style="width:${on}%"></span><span class="idle" style="width:${100 - on}%"></span></span></div>
    <div class="ut" title="${cbEsc(o.tokensTitle ?? '')}"><span class="ul">${tx('Claude tokens', 'Claude token')}</span><span class="uv">${cbTok(o.tokens)}</span>${o.wt != null ? `<span class="us">${tx(`${cbTok(o.wt)} weighted`, `加權 ${cbTok(o.wt)}`)}</span>` : ''}</div>
    ${est(tx('5-hour estimate', '5 小時估計'), o.est5, false, tx('Weighted tokens × the calibrated rate', '加權 token × 校準後的比率'))}
    ${est(tx('Weekly estimate (rough)', '每週估計（粗估）'), o.estW, true, tx('5-hour estimate × the weekly ÷ 5-hour ratio', '5 小時估計 × 每週 ÷ 5 小時比'))}
    <div class="ut acct" title="${cbEsc(tx('Snapshot increments while this was active, including other users of the account', '這段期間帳號用量快照的增加量，包含帳號的其他使用者'))}"><span class="ul">${tx('Account total (shared)', '帳號合計（共用）')}</span>
      <span class="uv">${o.acct5 == null && o.acctW == null ? tx('no readings', '無讀數') : `${pctA(o.acct5)} / ${pctA(o.acctW)}`}</span><span class="us">${o.acct5 == null && o.acctW == null ? '' : tx('5-hour / weekly', '5 小時 / 每週')}${o.out5 != null || o.outW != null ? `${o.acct5 == null && o.acctW == null ? '' : ' · '}${cbEsc(o.outLabel)}: ${pctA(o.out5)} / ${pctA(o.outW)}` : ''}</span></div>
  </div>`;
}

ard>] the PM Figma board in `extracted/boards/`; [KC] the Knowledge Center spec, [KC#\u003cid>] one of its\nanswered questions; [KC:credits] the stage credit table; [KC:settings] `product-rules/derived-video-enhancer-v2-settings.md`.\nWhere the PM Figma and the Knowledge Center spec differ, the newer item wins (the KC spec is updated to 2026-11-24 and\ncites the questions that changed the Figma notes); each difference is listed under Open questions.\nDesign: the Design Figma (vVDdw55BCWr94ZF7MJRVgx, page 1045:10519, UI owner Mini) is not inventoried yet (step 10\nowed); rows quote PM Figma strings and are checked again when the Design is read.\nPlatform: web, desktop Chrome at 1440 × 900 unless a row says otherwise; mobile-web rows use a 375 × 812 window\n(`device-web.ts window 375 812`).\n\n## Entries and rooms\n- R-001 [PMF:pm-1-info; PMF:pm-8-old-room; KC] The Video Enhancer entry opens the new room at /video-editor/video-enhancer/edit.\n- R-002 [KC#2f23bec67749; KC] The HD Video Converter entry in the top menu and More Tools keeps its SEO page /video-editor/hd-video-converter, and that page leads into the new Video Enhancer room.\n- R-003 [KC#2f23bec67749; KC] The AI Frame Interpolation entry keeps its SEO page /video-editor/ai-frame-interpolation, and that page leads into the new Video Enhancer room.\n- R-004 [PMF:pm-1-info; PMF:pm-8-old-room] The Video Denoiser entry opens the old room at /video-editor/video-denoiser/edit.\n- R-005 [PMF:pm-1-info; PMF:pm-8-old-room] The Video Brightener entry opens the old room at /video-editor/video-brightener/edit.\n- R-006 [PMF:pm-8-old-room; KC] /video-editor/video-restoration/edit opens the old room (Video Restoration).\n- R-007 [KC#646ef76308aa, #d9497315c276] Video Restoration is not in the top menu (desktop or mobile); it is reachable from the Launcher and the left tool menu.\n- R-008 [KC#b29e724be991] Video Enhancer carries the 「Enhanced」 tag, never 「New」, on the Launcher (Home › Popular Tools) and in the top menu (desktop and mobile).\n- R-009 [KC#ce875ff0bfd2] The three new-room entries (Video Enhancer, HD Video Converter, AI Frame Interpolation) open the room with the same default settings (R-025).\n\n## SEO page and upload\n- R-010 [KC#842d15e20293; PMF:pm-2-seo] The upload box lists, in this order, 「Supported file formats: MP4, MOV」, 「Maximum file duration: 8 min」 and 「Maximum file size: 10 GB」, and shows no resolution limit (Q-6).\n- R-011 [PMF:pm-3-pc-flow] Choose a file, drag and drop, and a sample video each open the tool room with the video.\n- R-012 [PMF:pm-3-pc-flow] While the video uploads the room shows 「Processing...」 with a percentage and 「It may take a few seconds. Please don't leave this page.」; every setting and Enhance are disabled until the upload ends.\n\n## Input limits\n- R-013 [KC; PMF:pm-2-seo] MP4 and MOV videos are accepted.\n- R-014 [PMF:pm-9-errors; KC] A file that is not MP4 or MOV shows 「Unsupported File Format」 / 「Only MP4 and MOV formats are supported. Please choose another video.」 with 「Got it」, and is not imported.\n- R-015 [PMF:pm-9-errors; KC] A file over 10 GB shows 「File Size Too Large」 / 「This video exceeds the 10 GB file size limit. Please choose a smaller video.」 with 「Got it」.\n- R-016 [PMF:pm-9-errors; KC] A video over 1440p shows 「Video Resolution Not Supported」 / 「This video exceeds the supported resolution limit (1440p). Please choose another video.」 with 「Got it」; a 1440p video is accepted.\n- R-017 [PMF:pm-9-errors; KC#b396530f653b] A video whose shorter side is under 128 px shows 「Video Resolution Not Supported」 / 「This video is below the minimum supported resolution (shorter side of 128 px). Please choose another video.」 with 「Got it」; a shorter side of exactly 128 px is accepted.\n- R-018 [PMF:pm-9-errors; KC#548d568d4290] A video over 120 fps (actual value, not rounded) shows 「Video Frame Rate Not Supported」 / 「This video exceeds the supported frame rate limit (120 fps). Please choose another video.」 with 「Got it」; exactly 120 fps is accepted.\n- R-019 [PMF:pm-9-errors; KC#253838ae2393, #2b46acf4dae8] A video whose frame rate cannot be read shows 「Unable to Use This Video」 / 「This video cannot be enhanced because it is missing required information, such as the frame rate. Try uploading a different video.」 with 「Got it」 and cannot be enhanced.\n- R-020 [KC#2a3d4654a75e] H.264 and HEVC (H.265) videos are accepted; an AV1 video shows 「Unsupported Format」 / 「This video contains an unsupported video codec. Please choose another video.」 with 「Got it」.\n- R-021 [KC#2a3d4654a75e] A video with an unsupported audio codec or audio format shows the old room's 「Audio Codec Not Supported」 or 「Audio Format Not Supported」 dialog.\n- R-022 [KC#4c092911b0fb; PMF:pm-10-pro-length] Uploading a video longer than 8:00 opens the Trimmer (at most 8:00 selectable) with 「Standard mode supports videos up to 8 minutes long. Please trim your video to continue.」 bottom left; after Trim only the trimmed part is imported. A video of exactly 8:00 is imported without the Trimmer.\n- R-023 [KC#4c092911b0fb; PMF:pm-9-errors] Only when the Trimmer cannot be used does an over-8:00 upload show 「Video Too Long」 / 「This video exceeds the 8-minute length limit. Please choose a shorter video.」 with 「Got it」.\n\n## Settings panel\n- R-024 [PMF:pm-3-pc-flow; KC] The panel title is 「Video Enhancer Settings」 with four settings: Mode (Standard, Professional), Enhance Style (HD, Natural), Output Resolution (Original, 720P, 1080P, 4K), Frame Rate (Same as source, 50, 60, 100, 120 fps); Replace Video and Trim Video sit above the preview.\n- R-025 [PMF:pm-3-pc-flow; KC] Defaults are Standard, HD, 1080P and Same as source; for a 1080p or 1440p source the Output Resolution default is 4K.\n- R-026 [PMF:pm-5-disabled-options; KC] Output Resolution options at or below the source are disabled: a 480p source has all enabled; 720p disables 720P; 1080p and 1440p disable 720P and 1080P. Original is always selectable.\n- R-027 [PMF:pm-5-disabled-options; KC#78c100376ddb] Frame Rate options at or below the source fps (rounded) are not shown, nor those above four times the source fps; a 120 fps source shows only Same as source.\n- R-028 [PMF:pm-3-pc-flow; KC#548d568d4290] The ⓘ tooltips read: Mode 「Standard: Balanced enhancement. Works well for most videos. Professional: Stronger restoration for older or badly compressed footage. Takes much longer to process. Supports videos up to 2:30.」; Enhance Style 「HD: A crisper, more detailed picture. Best when footage looks soft or blurry. Natural: A gentler result that stays true to the original. Best when footage already looks good.」; Output Resolution 「Resolution adjustment is supported up to 4K. Options lower than or equal to the original resolution are unavailable.」; Frame Rate 「Frame rate adjustment is supported up to 120 fps.」\n\n## Price\n- R-029 [PMF:pm-3-pc-flow; KC; KC:credits] Only Mode, Output Resolution and Frame Rate change the price; Enhance Style does not.\n- R-030 [PMF:pm-3-pc-flow; KC:settings] Enhance shows the total credits = the video's seconds rounded up × the per-second rate, and below it 「Enhance {seconds to 2 decimals} seconds ({rate} credits/sec)」 (Q-4).\n- R-031 [PMF:pm-3-pc-flow; KC] Hovering the ⓘ by the price shows 「Total credits depend on video duration and selected mode, resolution, and frame rate.」\n- R-032 [KC:credits; KC:settings] Per-second rates (stage): Standard 720p 1/1/1, 1080p 2/2/2, 4K 3/6/8; Professional 720p 2/4/8, 1080p 4/8/16, 4K 12/24/48 credits for ≤30 / ≤60 / ≤120 fps output (Q-5).\n- R-033 [KC:settings] Original is priced by the source's shorter side (≤720 → 720p, ≤1080 → 1080p, else 4K); Same as source by the source fps tier (≤30, ≤60, ≤120); 50 / 60 fps are the ≤60 tier and 100 / 120 fps the ≤120 tier.\n- R-034 [KC#37c46c3048be, #7938786ae16d] There is no free trial: every account, including a Free account without enough credits, sees the normal credit price and never 「1 Free Trial」.\n- R-035 [KC:settings] When no rate is found for a setting set, no price shows and Enhance cannot be pressed (never 0 credits). Not testable from the UI: every option the panel offers has a rate (R-032); listed for the Not added list.\n\n## Professional length limit\n- R-036 [PMF:pm-10-pro-length; KC] With a video longer than 2:30, Professional can still be selected, but Enhance is disabled and 「Professional mode supports videos up to 2:30.」 shows in red under Mode.\n- R-037 [PMF:pm-10-pro-length; KC] The 2:30 check reruns on switching Mode, Replace Video and finishing Trim: back to Standard, or a video of 2:30 or less, removes the red text and enables Enhance.\n- R-038 [PMF:pm-10-pro-length; KC] In Professional the Trimmer selects at most 2:30: the handle stops at the limit and an End Time past it is set to Start Time + 2:30; in Standard the limit is 8:00.\n- R-039 [PMF:pm-10-pro-length; KC] The Trimmer's bottom-left hint shows only when the source is over the mode's limit: Professional 「Professional mode supports videos up to 2:30 long. Please trim your video to continue.」, Standard 「Standard mode supports videos up to 8 minutes long. Please trim your video to continue.」\n- R-040 [PMF:pm-10-pro-length; KC] A clip over 8:00 brought in by Continue Editing opens the Trimmer first (at most 8:00), and Enhance works only after Trim.\n\n## Generate and result\n- R-041 [PMF:pm-3-pc-flow; KC] Enhance starts the job in Recent Gen as the old room did, and Recent Gen shows 「The generated videos can be found in My Library」 with 「My Library」 as a link.\n- R-042 [PMF:pm-3-pc-flow] Before any upload, Recent Gen shows 「Start by uploading a video to generate your video」.\n- R-043 [PMF:pm-3-pc-flow; KC] The result is also saved in My Library › Video Enhancer.\n- R-044 [PMF:pm-3-pc-flow; KC] After a job for the same video finishes, Enhance stays disabled until a setting changes, Replace Video loads another video or Trim changes the part.\n- R-045 [PMF:pm-3-pc-flow] Preview, Replace Video and Trim Video behave as in the original Video Enhancer.\n- R-046 [KC:credits; run-web.md] Enhance charges the quoted credits once, and the credit ledger shows the job under MyEdit with the tool's name.\n- R-078 [user 2026-11-25, Q-1] Upload errors (format, size, resolution, frame rate, codec, audio) show after the upload finishes, not when the file is chosen.\n- R-047 [PMF:pm-3-pc-flow; KC] The result has the chosen output: its resolution follows Output Resolution (Original = the source's) and its frame rate follows Frame Rate (Same as source = the source's).\n- Held R-048 [KC] Open in Editor is supported on results as in other video generation tools; its desktop place is not decided (Q-2).\n\n## Mobile web\n- R-049 [PMF:pm-4-mobile; KC] On a phone-width window the room shows 「Processing...」 with a percentage and 「It may take a few seconds. Please don’t leave this page.」 while uploading, with the summary and Enhance dimmed.\n- R-050 [PMF:pm-4-mobile; KC] On a phone-width window the room shows the summary 「Video Enhancer Settings」 with one line per setting (Mode | Standard, Enhance Style | HD, Output Resolution | 1080P, Frame Rate | Same as source), Enhance with credits and 「Enhance {seconds} seconds ({rate} credits/sec)」.\n- R-051 [PMF:pm-4-mobile; KC] Editing opens the panel with every option of the four settings and Replace Video / Trim Video above; Frame Rate opens a bottom sheet with the options R-027 allows.\n- R-052 [PMF:pm-4-mobile; KC] Generating shows 「Creating Your Video」 with a percentage and 「Please do not close this window or click the Back button on your browser.」; when sent, the page goes to My Library › Video Enhancer.\n- R-053 [PMF:pm-4-mobile; KC#a392c8ab593e] On a phone-width window, Professional with a video over 2:30 shows 「Video longer than 2:30」 in red under 「Mode | Professional」 in the summary and 「Professional mode supports videos up to 2:30.」 in the edit panel; Enhance is disabled until Standard or 2:30 or less.\n\n## Video Restoration (old room)\n- R-054 [PMF:pm-8-old-room; KC#ef6131aa247d] The old room is named Video Restoration and its panel title is 「Video Restoration Settings」.\n- R-055 [PMF:pm-8-old-room; KC] Its options are, in order, Lighting Adjustment, Video Denoise, Video Upscaler, Frame Interpolation.\n- R-056 [PMF:pm-8-old-room; KC] The option of the entry used is ticked on arrival (Denoiser → Video Denoise, Brightener → Lighting Adjustment); /video-restoration/edit ticks Lighting Adjustment and Video Denoise.\n- R-057 [KC#d9497315c276] The panel keeps its Back button; after Back, the left menu's Video Restoration reopens the four-option panel.\n- R-058 [PMF:pm-8-old-room; KC] Old-room results go to My Library › Video Restoration, and on a phone-width window the old room also goes straight to My Library › Video Restoration.\n\n## My Library\n- R-059 [PMF:pm-7-library; KC] My Library has a new Video Enhancer folder for new-room results, with the note 「Results from the new Video Enhancer are saved here. For results from the original Video Enhancer, go to Video Restoration.」\n- R-060 [PMF:pm-7-library; KC] The former Video Enhancer folder is renamed Video Restoration, shows 「(Formerly Video Enhancer)」, keeps the earlier results and has the note 「The original Video Enhancer has been renamed to Video Restoration. Your previous results are still here. Results from the new Video Enhancer are saved in the Video Enhancer folder.」\n- R-061 [KC#68c4aafc0467] /{lang}/cloud/library/video/video-enhancer opens the new Video Enhancer folder and /video-restoration the Video Restoration folder.\n\n## Emails\n- R-062 [PMF:pm-6-edm; KC] A finished new-room job sends 「Your Video Enhancer result is ready!」 with 「Access Your Video Enhancer」 linking to My Library › Video Enhancer.\n- R-063 [PMF:pm-6-edm; KC] A failed new-room job sends 「Your Video Enhancer result failed to generate.」 whose reason reads 「…content that violates our policy, or temporary server issues…」 and names My Library › Video Enhancer.\n- R-064 [PMF:pm-6-edm; KC] Video Restoration sends its own complete and failed emails (「Your Video Restoration result is ready!」 / 「…failed to generate.」) linking to Video Restoration.\n\n## Other tools\n- R-065 [PMF:pm-5-agent; KC] The Agent completes a Video Enhance V2 use case in Video Enhancer, always in Standard mode, and asks the user to trim a video over 8 minutes; a restoration use case is done with Video Edit by Chat.\n- R-066 [KC#b903e329a3e7] A video over 30 fps entering Video Editor shows the 3-second toast 「This {fps} fps video will export at 30 fps. Your original is unchanged.」 (two or more: 「Videos above 30 fps will export at 30 fps. Your originals are unchanged.」), once per video per session.\n- R-067 [KC#89dc53e3a2b3] The Pricing page names the new tool Video Enhancer and the old one Video Restoration.\n\n## Open questions\n- Q-8 [Design not read] The Design Figma (page 1045:10519) is not inventoried yet, so controls and strings come from the PM Figma (step 10 owed).\n\n## Answered questions (user, 2026-11-25, REQ-004)\n- Q-1 Upload errors show after the upload finishes, not on choosing the file → R-078; the 8 upload-error rows expect the dialog after the upload.\n- Q-2 Open in Editor is skipped for now → R-048, R-073, R-074 held; their rows (TC-098, TC-123, TC-124) are left out of this table.\n- Q-3 The HD Video Converter / AI Frame Interpolation SEO page URLs stay → R-002, R-003 as written.\n- Q-4 The total rounds the seconds up (8 × 3 = 24 for 7.3 s); the Figma 21 is illustrative → R-030 as written.\n- Q-5 Only demo is in scope: its stage rates are checked; production prices are not part of this table → R-032.\n- Q-6 The newer Knowledge Center decision holds for the SEO upload box → R-010 as written.\n- Q-7 Trim re-enables Enhance after a finished job → R-044 as written.\n- Q-9 The code-derived, unconfirmed rules are not tested now → R-070 – R-077 held; their rows (TC-121, TC-122, TC-125 – TC-127) are left out.\n- Q-10 Cancelling while processing is skipped → no row (as before).\n- Q-11 The room is a Light Mode page, as assumed (user, 2026-11-25, REQ-006) → R-101 and TC-144 stand; exact colours wait for the Design read (Q-8).\n- Q-12 UI languages are not checked now (user, 2026-11-25, REQ-006) → R-103 held, its row TC-146 left out; no MUI section.\n\n## Knowledge Center rules (standing input 7, checkpoint 2026-11-25)\nSource log: `knowledge-center.md` and `mcp-checkpoints.md` in this draft. R-068 and R-069 are an RD answer (#dfed049fda18,\nmerged into the KC rules); R-070 – R-077 are code-derived and unconfirmed (Q-9).\n- R-068 [KC#dfed049fda18] Credits are deducted when Enhance creates the job session, before the video upload starts: the ledger shows the charge while the upload dialog is still running.\n- R-069 [KC#dfed049fda18] Cancelling during the upload stops it before the job is sent, and the deducted credits come back automatically within 3–6 hours.\n- Held R-070 [KC:settings] With too little cloud storage, Enhance shows the cloud storage prompt first and sends nothing.\n- Held R-071 [KC:settings] When the credit check or the submit fails, the upload dialog closes and Enhance can be pressed again.\n- Held R-072 [KC:settings] Clicking a finished result card in Recent Gen opens a side-by-side preview of the original and the result.\n- Held R-073 [KC:settings] The result preview has 「Open in Editor」, which opens Video Editor with the result, not the original.\n- Held R-074 [KC:settings] The top bar's Open in Editor (beside Replace Video and Trim Video) opens Video Editor with the uploaded video as it is now (after Replace or Trim), not a result.\n- Held R-075 [KC:settings] At a window width of 1200 px or less, Recent Gen is not shown and result cards do not open the side-by-side preview.\n- Held R-076 [KC:settings] Trim Video cannot be pressed until the video's information has been read.\n- Held R-077 [KC:settings] A video brought in by Continue Editing goes through the same upload checks; a video that fails them shows the error dialog and the room does not open.\n\n## Product rules (domain knowledge, standing input 6, 2026-11-25)\nFrom `library/myedit/knowledge/` (KP-001 – KP-075, imported from the Contract Runner domain knowledge, user 2026-11-25).\nThey apply where the spec is silent; a tool value always comes from the spec. Applicability per rule: *Domain rules* below.\n- R-079 [KB: KP-007, KP-008] The upload percentage and the job's progress start at 0, never go back, and end in a final state (done or failed); a job never stays processing for ever.\n- R-080 [KB: KP-009] An upload cancelled by the user shows as cancelled, never as a failed generation.\n- R-081 [KB: KP-010] A failed job shows an understandable message without reloading the page, and the uploaded video and settings stay for a retry.\n- R-082 [KB: KP-011] While a job generates, Replace Video and Trim Video are disabled or leave the running job unaffected.\n- R-083 [KB: KP-012] The downloaded result matches its preview: same content, orientation, aspect ratio and length as the source, and audio when the source has audio.\n- R-084 [KB: KP-013, KP-069] A video with rotation metadata (a portrait phone video) shows upright in the preview, the Trimmer, the result and the download.\n- R-085 [KB: KP-014, KP-070] The downloaded file's extension matches its real format (an .mp4 is MP4) and the name is not empty; the exact naming is not specified.\n- R-086 [KB: KP-017] Previewing or downloading the same result again keeps it playable, never blank or broken.\n- R-087 [KB: KP-023] In the Trimmer, clicking the timeline moves the playhead there and playback goes on from it; playing a trimmed range stops at its end.\n- R-088 [KB: KP-025, KP-026] Leaving or reloading the room with an uploaded video not yet enhanced asks first: staying keeps the room as it was, leaving goes where the user asked.\n- R-089 [KB: KP-027] Leaving the room before any upload shows no unsaved-changes warning.\n- R-090 [KB: KP-028] Settings stay as chosen when the window crosses 1201 px (desktop panel ↔ mobile summary).\n- R-091 [KB: KP-029] A playing preview pauses or stops on Enhance and on Replace Video.\n- R-092 [KB: KP-031, KP-032, KP-068] After a reload the result is still in My Library › Video Enhancer, with its status current (processing → done).\n- R-093 [KB: KP-034] The My Library item's thumbnail and length belong to that result.\n- R-094 [KB: KP-038] The Get Credits entry stays at the top right on the SEO page and in the room.\n- R-095 [KB: KP-039, KP-040, KP-043] With enough credits no credit-shortage dialog shows, the charge equals the price shown, and the account menu's balance updates without a reload.\n- R-096 [KB: KP-041] A signed-out user pressing Enhance is asked to sign in; nothing is sent or charged.\n- R-097 [KB: KP-045] Video Enhancer and Video Restoration carry the same names in the Launcher, the top menu, the left tool menu and Pricing.\n- R-098 [KB: KP-050, KP-056] A disabled Enhance looks disabled and does nothing when clicked; hover, focus, selected and disabled states of the setting options are visible.\n- R-099 [KB: KP-051, KP-058] Opening one settings menu closes another; a menu opens beside its selector, does not cover it and shows every option or scrolls to it.\n- R-100 [KB: KP-052, KP-053] At a 1280 × 720 window and at 150 % zoom the settings, Enhance and Recent Gen stay reachable (by scrolling if needed), and a tooltip never hides Enhance.\n- R-101 [KB: KP-054, KP-055, KP-057] The room is a Light Mode page: menus, the bottom sheet, the Trimmer, dialogs, toasts, the generating progress and Recent Gen cards are light with legible text and icons, with no dark flash and no structural element (frame, divider) dropped (Q-11).\n- R-102 [KB: KP-060] Time codes (player, Trimmer, Recent Gen, My Library) never show xx:60; 60 seconds carry to the minute.\n- Held R-103 [KB: KP-061, KP-062, KP-063] In another site language (/tw/) the room's texts, tooltips, dialogs and errors are in that language, with no raw string keys or English defaults, and longer texts stay readable (Q-12).\n- R-104 [KB: KP-065, KP-067] With cloud storage full, Enhance first shows the storage-full prompt with 「Generate Anyway」 and 「Manage」: Generate Anyway goes on with the job, Manage opens the tool's album (My Library › Video Enhancer).\n- R-105 [KB: KP-074] The browser tab title is readable and names the tool on /video-enhancer, /video-enhancer/edit, /hd-video-converter, /ai-frame-interpolation and /video-restoration/edit; never a string key, undefined or another tool's title.\n- R-106 [KB: KP-075] The Video Enhancer and Video Restoration cards on the Launcher and Home do not use another tool's thumbnail.\n\n### Domain rules\n- Cited above: KP-007, KP-008 (R-079); KP-009 (R-080, with R-069); KP-010 (R-081); KP-011 (R-082); KP-012 (R-083); KP-013, KP-069 (R-084); KP-014, KP-070 (R-085); KP-017 (R-086); KP-023 (R-087); KP-025, KP-026 (R-088); KP-027 (R-089); KP-028 (R-090); KP-029 (R-091); KP-031, KP-032, KP-068 (R-092); KP-034 (R-093); KP-038 (R-094); KP-039, KP-040, KP-043 (R-095); KP-041 (R-096); KP-045 (R-097); KP-050, KP-056 (R-098); KP-051, KP-058 (R-099); KP-052, KP-053 (R-100); KP-054, KP-055, KP-057 (R-101); KP-060 (R-102); KP-061, KP-062, KP-063 (R-103); KP-065, KP-067 (R-104); KP-074 (R-105); KP-075 (R-106).\n- Already covered by spec requirements: KP-002, KP-006 (R-014 – R-019: each limit blocked with its dialog, never left processing); KP-004 (R-038: End Time past the limit set to the bound); KP-044 (R-001 – R-006); KP-049 (R-065); KP-073 (R-067).\n- n/a: KP-001 (no model choice: BytePlus only); KP-003 (no prompt); KP-005 (no stepper controls); KP-015 (no audio switch); KP-016 (no duration option; the result's length is R-083); KP-018, KP-019, KP-020, KP-021 (no selectable objects or editable text in the room); KP-022, KP-035, KP-066 (the tool makes no project); KP-024 (one-page room; the old room's Back reopens its panel, R-057); KP-030 (no templates or Inspiration); KP-033 (results save // the short Cov / Prog / Res links name themselves at once on hover or focus (a native title is slow, or never shows)
const tip=document.createElement('div');tip.id='tip';tip.hidden=true;document.body.append(tip);
for(const ev of ['mouseover','focusin'])document.addEventListener(ev,e=>{const a=e.target.closest?.('a[data-tip]');if(!a){tip.hidden=true;return}
  tip.textContent=a.dataset.tip;tip.hidden=false;const r=a.getBoundingClientRect();tip.style.left=Math.max(8,Math.min(r.left,innerWidth-tip.offsetWidth-8))+'px';tip.style.top=(r.bottom+6)+'px'});
document.addEventListener('keydown',e=>{const d=e.target.closest?.('.cv[data-id]');if(d&&e.key==='Enter'){e.preventDefault();editCell(d)}});
document.addEventListener('click',e=>{const m=e.target.closest?.('a.qmark');if(!m)return;e.preventDefault();
  if(location.hash!=='#q-'+m.dataset.q)history.pushState(null,'','#q-'+m.dataset.q);openQuestion(m.dataset.q)});
// a question's row link scrolls to the row every time, also when the address already ends in that row's #ID
document.addEventListener('click',e=>{const a=e.target.closest?.('a.qcase');if(!a)return;e.preventDefault();
  if(location.hash!=='#'+a.dataset.case)history.pushState(null,'','#'+encodeURIComponent(a.dataset.case));focusRow()});
applyLang();header();questions();filters();body();counts();focusRow();if(/^#q-Q-\d+$/.test(location.hash))openQuestion(location.hash.slice(3));
</script>
</body>
</html>
