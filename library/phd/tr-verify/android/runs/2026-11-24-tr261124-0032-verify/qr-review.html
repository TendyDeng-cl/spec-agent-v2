<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TR261124-0032 QA Report</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1b1f24;--muted:#5b6470;--line:#d9dde3;--ok:#17803d;--fail:#c62828;--hold:#5b6470;--accent:#1a5fd0;--pre:#f0f2f5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121417;--card:#1b1e23;--fg:#e6e8eb;--muted:#9aa3ad;--line:#2e333a;--ok:#4cc27a;--fail:#ff6b6b;--hold:#9aa3ad;--accent:#6ea2ff;--pre:#23272d}}
:root[data-theme="dark"]{--bg:#121417;--card:#1b1e23;--fg:#e6e8eb;--muted:#9aa3ad;--line:#2e333a;--ok:#4cc27a;--fail:#ff6b6b;--nv:#e0b84a;--hold:#9aa3ad;--accent:#6ea2ff;--pre:#23272d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 4px}h2{font-size:16px;margin:0}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}
.errors{border-color:var(--fail)}.errors li{color:var(--fail)}
dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:0}dt{color:var(--muted)}dd{margin:0;word-break:break-word}
pre{white-space:pre-wrap;word-break:break-word;background:var(--pre);padding:10px;border-radius:8px;margin:8px 0;font:13px/1.45 ui-monospace,Menlo,monospace}
.bar{position:sticky;top:0;z-index:2;background:var(--bg);padding:8px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
.pill{padding:2px 8px;border-radius:99px;font-size:13px;font-weight:600;border:1px solid currentColor}
.OK{color:var(--ok)}.Fail{color:var(--fail)}.Hold{color:var(--hold)}
.row-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
select,button,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
textarea{width:100%;min-height:90px;font:13px/1.45 ui-monospace,Menlo,monospace;resize:vertical}
.edited{border-color:var(--accent)}
.imgs{display:flex;gap:8px;overflow-x:auto;padding:4px 0}
.imgs figure{margin:0;flex:0 0 auto}.imgs img{height:260px;border:1px solid var(--line);border-radius:6px;cursor:zoom-in}
.imgs figcaption{font-size:12px;color:var(--muted);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:5;cursor:zoom-out}
#zoom img{max-width:96vw;max-height:96vh}
label.note{display:block;margin-top:8px}
@media (max-width:600px){dl{grid-template-columns:1fr}.imgs img{height:200px}}
</style>
</head>
<body>
<main>
<h1 id="h"></h1>
<p class="muted">Review before anything goes on ECL. Change a verdict or edit a Reason here, then press <b>Copy decisions</b> and paste them back in chat. Hold keeps a bug off the report and leaves it alone on the TR (for anything not fully verified).</p>
<div id="errors"></div>
<div class="bar"><span id="counts"></span><span style="flex:1"></span><button id="copy" class="primary">Copy decisions</button><button id="reset">Reset edits</button></div>
<section class="card"><h2>Report fields</h2><dl id="fields"></dl><pre id="details"></pre></section>
<div id="rows"></div>
</main>
<div id="zoom"><img alt=""></div>
<script>
const D = {"tr":"TR261124-0032","build":"20.19.0.202611241407","tester":"WILLY_WU","template":"Standard Report","shortDescription":"20.19.0.v202611241407 (Deluxe) for CyberLink 9 Languages + RUS + PTB (Enu, Cht, Chs, Jpn, Kor, Deu, Esp, Fra, Ita, Rus, Ptb) (R9)","testResult":"PHD-A - Bug verification [OK=21, Fail=0]","details":"PHD-A - Bug verification [OK=21, Fail=0]","evidence":null,"perBug":true,"errors":[],"rows":[{"bug":"PHA262026P0070","title":"PHD-A 20.19.0 - Mixpanel: There is no mixpanel log when saving photo or video in Recent","creator":"WILLY_WU","severity":"2","images":["screenshots/c_43_photo_pack.png","screenshots/c_44_photo_saved.png","screenshots/c_63_recent_video_done.png","screenshots/c_65_video_saving.png"],"result":"OK","summary":"Saving a photo and a video in My AI Artwork Recent now logs the Mixpanel event Artwork_Result_Save.","reason":"Verified OK with 202611241407 build.\nSaving a photo and a video in My AI Artwork Recent now logs the Mixpanel event Artwork_Result_Save.\nRisk test: n/a"},{"bug":"PHA262026P0072","title":"PHD-A 20.19.0 - [AIAgent] Swipe_Collage: Template opens with more empty frames than its photo count","creator":"WILLY_WU","severity":"3","images":["screenshots/51_p0072_two_photo_canvas.png","screenshots/53_p0072_picker.png","screenshots/54_p0072_four_photo_canvas.png"],"result":"OK","summary":"Templates now open with as many empty frames as the photo count on the card.","reason":"Verified OK with 202611241407 build.\nTemplates now open with as many empty frames as the photo count on the card.\nRisk test: n/a"},{"bug":"PHA262026P0073","title":"PHD-A 20.19.0 - [AIAgent][UI] Swipe_Collage: Selected photos are not marked in the photo picker grid","creator":"WILLY_WU","severity":"3","images":["screenshots/16_p0073_two_picked.png","screenshots/73_p0074_seven_picked.png"],"result":"OK","summary":"Selected photos are now marked with numbers in the photo picker grid.","reason":"Verified OK with 202611241407 build.\nSelected photos are now marked with numbers in the photo picker grid.\nRisk test: n/a"},{"bug":"PHA262026P0074","title":"PHD-A 20.19.0 - [AIAgent] Swipe_Collage: Photo picker limit counts only the current page's frames and has no 20 cap","creator":"WILLY_WU","severity":"2","images":["screenshots/72_p0074_picker.png","screenshots/73_p0074_seven_picked.png"],"result":"OK","summary":"The picker limit now counts the empty frames on all pages (all 7 photos can be picked at once on the 7-photo · 3-page template), as RD's fix describes.","reason":"Verified OK with 202611241407 build.\nThe picker limit now counts the empty frames on all pages (all 7 photos can be picked at once on the 7-photo · 3-page template), as RD's fix describes.\nRisk test: n/a"},{"bug":"PHA262026P0076","title":"PHD-A 20.19.0 - [AIAgent] Swipe_Collage: 「Discard」 goes to the Template Page, not the Template Preview","creator":"WILLY_WU","severity":"3","images":["screenshots/40_p0076_discard_dialog.png","screenshots/42_p0076_after_discard.png","screenshots/78_p0076_discard_7photo.png"],"result":"OK","summary":"Discard now returns to the Template Preview of that template.","reason":"Verified OK with 202611241407 build.\nDiscard now returns to the Template Preview of that template.\nRisk test: n/a"},{"bug":"PHA262026P0077","title":"PHD-A 20.19.0 - [AIAgent] Swipe_Collage: System Back does not close the 「Discard changes?」 dialog","creator":"WILLY_WU","severity":"3","images":["screenshots/40_p0076_discard_dialog.png","screenshots/41_p0077_after_back.png"],"result":"OK","summary":"System Back now closes the 「Discard changes?」 dialog as Keep does.","reason":"Verified OK with 202611241407 build.\nSystem Back now closes the 「Discard changes?」 dialog as Keep does.\nRisk test: n/a"},{"bug":"PHA262026P0079","title":"PHD-A 20.19.0 - [AIAgent] Swipe_Collage: Frame tool bar has no Flip H, Flip V or Shadow, and the floating icons no Lock","creator":"WILLY_WU","severity":"3","images":["screenshots/21_p0079_polaroid_tap1.png","screenshots/22_p0079_bar_end.png"],"result":"OK","summary":"Frame focus now offers Opacity, Shadow, Flip H, Flip V, Duplicate, Lock and Delete, and the floating icons include Lock.","reason":"Verified OK with 202611241407 build.\nFrame focus now offers Opacity, Shadow, Flip H, Flip V, Duplicate, Lock and Delete, and the floating icons include Lock.\nRisk test: n/a"},{"bug":"PHA262026P0080","title":"PHD-A 20.19.0 - [AIAgent] Swipe_Collage: A tap in image focus clears the selection instead of returning to frame focus","creator":"WILLY_WU","severity":"3","images":["screenshots/23_p0080_tap2.png","screenshots/24_p0080_tap3.png"],"result":"OK","summary":"A tap in image focus now returns to frame focus.","reason":"Verified OK with 202611241407 build.\nA tap in image focus now returns to frame focus.\nRisk test: n/a"},{"bug":"PHA262026P0082","title":"PHD-A 20.19.0 - [AIAgent][UI] Swipe_Collage: No 「Long press & drag to swap」 hint while dragging a photo to swap","creator":"WILLY_WU","severity":"3","images":["screenshots/25_p0082_mid_drag.png","screenshots/26_p0082_after_drop.png","screenshots/76_p0082_mid_drag_7photo.png","screenshots/77_p0082_after_drop_7photo.png"],"result":"OK","summary":"Long-press and drag swaps the photos; per RD's resolution no extra hint is shown, as in the original Collage.","reason":"Verified OK with 202611241407 build.\nLong-press and drag swaps the photos; per RD's resolution no extra hint is shown, as in the original Collage.\nRisk test: n/a"},{"bug":"PHA262026P0083","title":"PHD-A 20.19.0 - [AIAgent][UI] Swipe_Collage: Frame panel thumbnails carry no photo count","creator":"WILLY_WU","severity":"3","images":["screenshots/28_p0083_frame_sheet.png","screenshots/29_p0083_frame_sheet_scrolled.png","screenshots/30_p0083_replace_frame_sheet.png"],"result":"OK","summary":"Frame thumbnails in Add Layer › Frame and Replace frame show their slot layout, which per RD's resolution indicates the photo count.","reason":"Verified OK with 202611241407 build.\nFrame thumbnails in Add Layer › Frame and Replace frame show their slot layout, which per RD's resolution indicates the photo count.\nRisk test: n/a"},{"bug":"PHA262026P0094","title":"PHD-A 20.19.0 - [AIAgent][UI] Swipe_Collage: Pages has no 「Page n / N」 or − / + stepper and selects no page on entry","creator":"WILLY_WU","severity":"3","images":["screenshots/b_10_p0094_pages_from_p1.png","screenshots/b_12_p0094_tap_page2_frame.png","screenshots/b_13_p0094_canvas_on_page2.png","screenshots/b_14_p0094_pages_from_p2.png"],"result":"OK","summary":"Pages now shows the − | + stepper above the bottom panel and 「Page N / total」 for the selected page, as RD's fix describes.","reason":"Verified OK with 202611241407 build.\nPages now shows the − | + stepper above the bottom panel and 「Page N / total」 for the selected page, as RD's fix describes.\nRisk test: n/a"},{"bug":"PHA262026P0095","title":"PHD-A 20.19.0 - [AIAgent] Swipe_Collage: Pages has no ✓ or ✕; leaving keeps every page change without 「Discard changes?」","creator":"WILLY_WU","severity":"3","images":["screenshots/b_20_p0095_added.png","screenshots/b_21_p0095_x_dialog.png","screenshots/b_22_p0095_after_keep.png","screenshots/b_26_p0095_discard_tap_coord.png"],"result":"OK","summary":"Pages now has ✕ and ✓: ✓ applies the changes and ✕ asks 「Discard changes?」 first when there are changes.","reason":"Verified OK with 202611241407 build.\nPages now has ✕ and ✓: ✓ applies the changes and ✕ asks 「Discard changes?」 first when there are changes.\nRisk test: n/a"},{"bug":"PHA262026P0097","title":"PHD-A 20.19.0 - [AIAgent][UI] Swipe_Collage: Pages move button selects on a tap; dragging shows no enlarged page or hint","creator":"WILLY_WU","severity":"3","images":["screenshots/b_40_p0097_pages_before.png","screenshots/b_41_p0097_after_plain_tap.png","screenshots/b_42_p0097_after_drop.png","recordings/p0097-pair.png"],"result":"OK","summary":"A dragged page is now enlarged, tilted and translucent, and long-press-and-drag reorders pages, as RD's fix describes.","reason":"Verified OK with 202611241407 build.\nA dragged page is now enlarged, tilted and translucent, and long-press-and-drag reorders pages, as RD's fix describes.\nRisk test: n/a"},{"bug":"PHA262026P0103","title":"PHD-A 20.19.0 - [AIAgent] Swipe_Collage: Free user tapping a PRO template card gets the IAP page instead of the preview","creator":"WILLY_WU","severity":"2","images":["screenshots/02_template_page.png","screenshots/10_p0103_crowned_card_tap.png","screenshots/11_p0103_canvas.png","screenshots/18_p0103_export_tap.png"],"result":"OK","summary":"Tapping a crowned PRO template no longer opens the IAP; the template can be previewed and used on the Canvas, and the IAP shows only at export, as RD's fix describes.","reason":"Verified OK with 202611241407 build.\nTapping a crowned PRO template no longer opens the IAP; the template can be previewed and used on the Canvas, and the IAP shows only at export, as RD's fix describes.\nRisk test: n/a"},{"bug":"PHA262026P0138","title":"PHD-A 20.19.0 - [AIAgent] Reel_Creator: Wi-Fi lost during upload: 70 charged, 「Credits refunded」 but no refund","creator":"WILLY_WU","severity":"2","images":["screenshots/f_25_try4_dialog.png","screenshots/f_27_try4_history.png","screenshots/f_35_try4_done.png","screenshots/f_51_detail_end.png"],"result":"OK","summary":"With the connection lost while Apply Effect was sent, the confirm page now shows 「Network Error」 instead of 「Credits refunded」, Retry in My AI Artwork finishes the reel, and the job is charged only once.","reason":"Verified OK with 202611241937 build.\nWith the connection lost while Apply Effect was sent, the confirm page now shows 「Network Error」 instead of 「Credits refunded」, Retry in My AI Artwork finishes the reel, and the job is charged only once.\nRisk test: n/a"},{"bug":"PHA262026P0141","title":"PHD-A 20.19.0 - [AIAgent] Image_to_Video: No 「Settings applied」 toast when Reuse opens the Custom page","creator":"WILLY_WU","severity":"3","images":["screenshots/c_52_saveshare.png","screenshots/c_55_custom_after_reuse.png","screenshots/c_56_reuse_settings.png"],"result":"OK","summary":"Reuse now shows the toast 「Settings applied」 when the Custom page opens.","reason":"Verified OK with 202611241407 build.\nReuse now shows the toast 「Settings applied」 when the Custom page opens.\nRisk test: n/a"},{"bug":"PHA262026P0143","title":"PHD-A 20.19.0 - [AIAgent] Image_to_Video: ‹ / Back in the room opened by Reuse go to My AI Artwork, not Save & Share","creator":"WILLY_WU","severity":"3","images":["screenshots/c_59_p0143_room2.png","screenshots/c_57_p0143_chevron.png","screenshots/c_60_p0143_sysback.png"],"result":"OK","summary":"‹ and system Back in the room opened by Reuse now return to the video's Save & Share page.","reason":"Verified OK with 202611241407 build.\n‹ and system Back in the room opened by Reuse now return to the video's Save & Share page.\nRisk test: n/a"},{"bug":"PHA262026P0144","title":"PHD-A 20.19.0 - [AIAgent] Image_to_Video: Tracking: Reuse logs Artwork_Reuse_Click without model, not ImageToVideo_Reuse_Click","creator":"WILLY_WU","severity":"3","images":["screenshots/c_52_saveshare.png","screenshots/c_53_reuse_room.png"],"result":"OK","summary":"Tapping Reuse now logs ImageToVideo_Reuse_Click with the video's model.","reason":"Verified OK with 202611241407 build.\nTapping Reuse now logs ImageToVideo_Reuse_Click with the video's model.\nRisk test: n/a"},{"bug":"PHA262026P0152","title":"PHD-A 20.19.0 - [AIAgent] Xmas_NY_Sale: Launcher: NY Sale IAP icon stays regular orange crown, no champagne-glasses animation","creator":"WILLY_WU","severity":"2","images":["screenshots/e_04_ny_launcher.png","screenshots/e_06_ny_icon_crop.png","screenshots/e_05_ny_icon_frames.png","screenshots/e_03_xmas_icon.png"],"result":"OK","summary":"During the NY Sale the Free user's Launcher IAP icon is now the animated champagne glasses.","reason":"Verified OK with 202611241407 build.\nDuring the NY Sale the Free user's Launcher IAP icon is now the animated champagne glasses.\nRisk test: n/a"},{"bug":"PHA262026P0160","title":"PHD-A 20.19.0 - [AIAgent] Swipe_Collage: Frame 「+」 needs two taps; the first selects the layer over it","creator":"WILLY_WU","severity":"3","images":["screenshots/12_p0160_10photo_one_tap.png","screenshots/14_p0160_10photo_clean_tap.png","screenshots/15_p0160_10photo_second_tap.png","screenshots/61_p0160_3photo_one_tap.png"],"result":"OK","summary":"Tapping a frame cycles between the element and its slot, and the slot's 「+」 opens the photo picker, as RD's fix describes.","reason":"Verified OK with 202611241407 build.\nTapping a frame cycles between the element and its slot, and the slot's 「+」 opens the photo picker, as RD's fix describes.\nRisk test: n/a"},{"bug":"PHA262026P0162","title":"PHD-A 20.19.0 - [AIAgent] Swipe_Collage: Removal room shows the photo without its Adjustments","creator":"WILLY_WU","severity":"3","images":["screenshots/32_p0162_exposure4.png","screenshots/33_p0162_canvas_after_apply.png","screenshots/36_p0162_removal_room.png"],"result":"OK","summary":"The Removal room now shows the photo with its Adjustments, as on the Canvas.","reason":"Verified OK with 202611241407 build.\nThe Removal room now shows the photo with its Adjustments, as on the Canvas.\nRisk test: n/a"}]};
const KEY = 'qr-review:' + D.tr + ':' + D.build;
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
const store = () => { try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {} };
const $ = s => document.querySelector(s);
const el = (t, a = {}, ...c) => { const n = document.createElement(t); for (const k in a) k === 'class' ? n.className = a[k] : n.setAttribute(k, a[k]); n.append(...c); return n; };
$('#h').textContent = D.tr + ' · QA Report draft · ' + D.build;
if (D.errors.length) $('#errors').append(el('div', { class: 'card errors' }, el('b', {}, 'Check found problems'), el('ul', {}, ...D.errors.map(e => el('li', {}, e)))));
for (const [k, v] of [['Template', D.template], ['Tester', D.tester], ['Short Description', D.shortDescription], ['Test Result', D.testResult],
  D.perBug ? ['Evidence', 'uploaded to each eBug (' + D.rows.filter(r => r.result !== 'Hold').reduce((n, r) => n + r.images.length + (r.logs || []).length, 0) + ' files), named in its Reason']
    : ['Evidence ZIP', D.evidence ? D.evidence.file + ' (' + D.evidence.files + ' files)' : 'not packed yet']]) $('#fields').append(el('dt', {}, k), el('dd', {}, v));
$('#details').textContent = D.details;
const state = r => saved[r.bug] || {};
function counts() {
  const c = { OK: 0, Fail: 0, Hold: 0 };
  for (const r of D.rows) c[state(r).result || r.result]++;
  $('#counts').replaceChildren(...Object.entries(c).map(([k, v]) => el('span', { class: 'pill ' + k }, k + ' ' + v)));
}
for (const r of D.rows) {
  const s = state(r);
  const sel = el('select', { 'aria-label': 'Verdict for ' + r.bug }, ...['OK', 'Fail', 'Hold'].map(v => { const o = el('option', { value: v }, v); if ((s.result || r.result) === v) o.selected = true; return o; }));
  const ta = el('textarea', { 'aria-label': 'Reason for ' + r.bug });
  ta.value = s.reason ?? r.reason;
  const mark = () => ta.classList.toggle('edited', ta.value !== r.reason || sel.value !== r.result);
  sel.onchange = () => { saved[r.bug] = { ...state(r), result: sel.value }; store(); counts(); mark(); };
  ta.oninput = () => { saved[r.bug] = { ...state(r), reason: ta.value }; store(); mark(); };
  const note = el('textarea', { 'aria-label': 'Reviewer note for ' + r.bug, placeholder: 'Reviewer note (optional)', style: 'min-height:40px' });
  note.value = s.note || '';
  note.oninput = () => { saved[r.bug] = { ...state(r), note: note.value }; store(); };
  const imgs = el('div', { class: 'imgs' }, ...r.images.map(src => el('figure', {}, el('img', { src, alt: src, loading: 'lazy' }), el('figcaption', { title: src }, src.split('/').pop()))));
  const meta = [r.creator, r.severity && 'S' + r.severity].filter(Boolean).join(' · ');
  $('#rows').append(el('section', { class: 'card', id: r.bug },
    el('div', { class: 'row-head' }, el('h2', {}, r.bug + ' ', el('span', { class: 'pill ' + r.result }, 'agent: ' + r.result)), sel),
    el('p', {}, r.title + (meta ? ' ' : ''), el('span', { class: 'muted' }, meta)),
    el('p', { class: 'muted' }, r.summary + (r.note ? ' — ' + r.note : '')),
    ta, imgs, el('label', { class: 'note' }, note)));
  mark();
}
counts();
const fit = t => { t.style.height = 'auto'; t.style.height = t.scrollHeight + 4 + 'px'; };
document.querySelectorAll('textarea').forEach(t => { fit(t); t.addEventListener('input', () => fit(t)); });
document.addEventListener('click', e => { if (e.target.matches('.imgs img')) { $('#zoom img').src = e.target.src; $('#zoom').style.display = 'flex'; } });
$('#zoom').onclick = () => { $('#zoom').style.display = 'none'; };
$('#copy').onclick = async () => {
  const out = D.rows.map(r => { const s = state(r); const res = s.result || r.result; const reason = s.reason ?? r.reason;
    return { bug: r.bug, result: res, changed: res !== r.result || reason !== r.reason, ...(reason !== r.reason ? { reason } : {}), ...(s.note ? { note: s.note } : {}) }; });
  const text = 'QR decisions ' + D.tr + ' ' + D.build + '\n' + JSON.stringify(out, null, 1);
  try { await navigator.clipboard.writeText(text); $('#copy').textContent = 'Copied'; } catch (e) { prompt('Copy this', text); }
  setTimeout(() => { $('#copy').textContent = 'Copy decisions'; }, 1500);
};
$('#reset').onclick = () => { if (confirm('Drop every edit on this page?')) { saved = {}; store(); location.reload(); } };
</script>
