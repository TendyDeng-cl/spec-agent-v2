<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TR261124-0075 QA Report</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1b1f24;--muted:#5b6470;--line:#d9dde3;--ok:#17803d;--fail:#c62828;--hold:#5b6470;--accent:#1a5fd0;--pre:#f0f2f5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121417;--card:#1b1e23;--fg:#e6e8eb;--muted:#9aa3ad;--line:#2e333a;--ok:#4cc27a;--fail:#ff6b6b;--hold:#9aa3ad;--accent:#6ea2ff;--pre:#23272d}}
:root[data-theme="dark"]{--bg:#121417;--card:#1b1e23;--fg:#e6e8eb;--muted:#9aa3ad;--line:#2e333a;--ok:#4cc27a;--fail:#ff6b6b;--nv:#e0b84a;--hold:#9aa3ad;--accent:#6ea2ff;--pre:#23272d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 4px}h2{font-size:16px;margin:0}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}
.errors{border-color:var(--fail)}.errors li{color:var(--fail)}
dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:0}dt{color:var(--muted)}dd{margin:0;word-break:break-word}
pre{white-space:pre-wrap;word-break:break-word;background:var(--pre);padding:10px;border-radius:8px;margin:8px 0;font:13px/1.45 ui-monospace,Menlo,monospace}
.bar{position:sticky;top:0;z-index:2;background:var(--bg);padding:8px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
.pill{padding:2px 8px;border-radius:99px;font-size:13px;font-weight:600;border:1px solid currentColor}
.OK{color:var(--ok)}.Fail{color:var(--fail)}.Hold{color:var(--hold)}
.row-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
select,button,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
textarea{width:100%;min-height:90px;font:13px/1.45 ui-monospace,Menlo,monospace;resize:vertical}
.edited{border-color:var(--accent)}
.imgs{display:flex;gap:8px;overflow-x:auto;padding:4px 0}
.imgs figure{margin:0;flex:0 0 auto}.imgs img{height:260px;border:1px solid var(--line);border-radius:6px;cursor:zoom-in}
.imgs figcaption{font-size:12px;color:var(--muted);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:5;cursor:zoom-out}
#zoom img{max-width:96vw;max-height:96vh}
label.note{display:block;margin-top:8px}
@media (max-width:600px){dl{grid-template-columns:1fr}.imgs img{height:200px}}
</style>
</head>
<body>
<main>
<h1 id="h"></h1>
<p class="muted">Review before anything goes on ECL. Change a verdict or edit a Reason here, then press <b>Copy decisions</b> and paste them back in chat. Hold keeps a bug off the report and leaves it alone on the TR (for anything not fully verified).</p>
<div id="errors"></div>
<div class="bar"><span id="counts"></span><span style="flex:1"></span><button id="copy" class="primary">Copy decisions</button><button id="reset">Reset edits</button></div>
<section class="card"><h2>Report fields</h2><dl id="fields"></dl><pre id="details"></pre></section>
<div id="rows"></div>
</main>
<div id="zoom"><img alt=""></div>
<script>
const D = {"tr":"TR261124-0075","build":"20.19.0.202611241937","tester":"WILLY_WU","template":"Standard Report","shortDescription":"20.19.0.v202611241937 (Deluxe) for CyberLink 9 Languages + RUS + PTB (Enu, Cht, Chs, Jpn, Kor, Deu, Esp, Fra, Ita, Rus, Ptb) (R11)","testResult":"PHD-A - Bug verification [OK=12, Fail=0]","details":"PHD-A - Bug verification [OK=12, Fail=0]","evidence":null,"perBug":true,"errors":[],"rows":[{"bug":"PHA242024-1271","title":"PHD-A 19.8.0 - AISketch-realistic: The selected style in female is not unselected after selecting a style in male","creator":"WILLY_WU","severity":"2","images":["screenshots/a_54_1271_tap_clean_nophoto.png","screenshots/a_56_1271_male_cine_selected.png","screenshots/a_57_1271_back_to_female.png"],"result":"OK","summary":"In AI Art, which now holds the female and male style lists, selecting a male style clears the female selection.","reason":"Verified OK with 202611241937 build.\nIn AI Art, which now holds the female and male style lists, selecting a male style clears the female selection.\nRisk test: n/a"},{"bug":"PHA262026-0031","title":"PHD-A 20.9.2 - AI_Background: The [Generate] button is not lighted up after generating an image","creator":"WILLY_WU","severity":"2","images":["screenshots/b_05_0031_before_generate.png","screenshots/b_07_0031_after.png","screenshots/b_09_0031_prompt_changed.png"],"result":"OK","summary":"After a Custom generation in AI Background the button is lit and can be tapped again.","reason":"Verified OK with 202611241937 build.\nAfter a Custom generation in AI Background the button is lit and can be tapped again.\nRisk test: n/a"},{"bug":"PHA262026-0051","title":"PHD-A 20.10.0 - [Samsung S23]Sign in: The page shows nothing after entering User Sign in","creator":"WILLY_WU","severity":"2","images":["screenshots/a_03_0051_signin_page.png","screenshots/a_04_0051_signin_page.png"],"result":"OK","summary":"The User Sign in page now shows its full content (Email, Password, Sign Up, Google and Facebook sign-in).","reason":"Verified OK with 202611241937 build.\nThe User Sign in page now shows its full content (Email, Password, Sign Up, Google and Facebook sign-in).\nRisk test: n/a"},{"bug":"PHA262026-0243","title":"PHD-A 20.13.0 - Image_to_Video: The sample image is not showing right after changing language and selecting style","creator":"WILLY_WU","severity":"2","images":["screenshots/d_bzh_01.png","screenshots/d_bzh_05.png","screenshots/e_85_i2v_zh_sheet.png"],"result":"OK","summary":"After changing the system language, each Image to Video style shows its own sample image right away.","reason":"Verified OK with 202611241937 build.\nAfter changing the system language, each Image to Video style shows its own sample image right away.\nRisk test: n/a"},{"bug":"PHA262026-0289","title":"PHD-A 20.13.0 - [ATFound]ID_Photo: The preview is showing all black after tapping the [X] button in Makeup","creator":"WILLY_WU","severity":"2","images":["screenshots/a_34a_0289_lipstick_applied.png","screenshots/a_37_0289_x_cycle7_immediate.png","screenshots/a_42_0289_v_beautify_applied.png"],"result":"OK","summary":"In ID Photo, tapping [X] in Makeup returns to the normal preview every time, with no black preview.","reason":"Verified OK with 202611241937 build.\nIn ID Photo, tapping [X] in Makeup returns to the normal preview every time, with no black preview.\nRisk test: n/a"},{"bug":"PHA262026-0360","title":"PHD-A 20.15.1 - Image_to_video: Generated video from \"Feeling Good\" template has no sound but sound setting = ON","creator":"ALBERT_CHANG","severity":"2","images":["screenshots/b_51_0360_sound_on_saved.png","screenshots/b_55_0360_result.png"],"result":"OK","summary":"The video generated from the Feeling Good template with sound on now has an audible sound track.","reason":"Verified OK with 202611241937 build.\nThe video generated from the Feeling Good template with sound on now has an audible sound track.\nRisk test: n/a"},{"bug":"PHA262026-0407","title":"PHD-A 20.16.5 - [UX][Light_mode]Image_to_video: Icon of \"Happy Horse\" model is not obvious","creator":"ALBERT_CHANG","severity":"3","images":["screenshots/a_76_0407_happyhorse_light.png","screenshots/a_76_0407_happyhorse_light_icon_zoom.png","screenshots/a_74_0407_happyhorse_dark.png"],"result":"OK","summary":"In light mode the Happy Horse model icon is now a dark icon that stands out clearly on the light card.","reason":"Verified OK with 202611241937 build.\nIn light mode the Happy Horse model icon is now a dark icon that stands out clearly on the light card.\nRisk test: n/a"},{"bug":"PHA262026P0025","title":"PHD-A 20.18.0 - [UX]AI_Background: There is no [Artwork] button in AI Background","creator":"WILLY_WU","severity":"2","images":["screenshots/a_09_p0025_ai_background_room.png","screenshots/a_10_p0025_artwork.png"],"result":"OK","summary":"AI Background now has an Artwork button that opens My AI Artwork on the AI Background tab.","reason":"Verified OK with 202611241937 build.\nAI Background now has an Artwork button that opens My AI Artwork on the AI Background tab.\nRisk test: n/a"},{"bug":"PHA262026P0045","title":"PHD-A 20.18.0 - [UX]AI_edit_agent: UI always focus on photo tab of AI edit agent category even the latest generated result is video after tapping [artwork] button of AI edit agent","creator":"ALBERT_CHANG","severity":"3","images":["screenshots/b_29_p0045_artwork_video.png","screenshots/b_34_p0045_artwork_photo.png","screenshots/b_21_p0045_artwork_noresult.png"],"result":"OK","summary":"After a video result, the Artwork button now opens the Video tab of the AI Edit Agent category (Photo tab after an image result).","reason":"Verified OK with 202611241937 build.\nAfter a video result, the Artwork button now opens the Video tab of the AI Edit Agent category (Photo tab after an image result).\nRisk test: n/a"},{"bug":"PHA262026P0056","title":"PHD-A 20.18.0 - [CS003208922]AI_Edit_Agent: The cost credits are not the same in rules page and the pop-up dialog","creator":"WILLY_WU","severity":"2","images":["screenshots/a_61_p0056_info.png","screenshots/a_67_p0056_after_send.png","screenshots/b_30_p0056_info.png"],"result":"OK","summary":"The rules page and the generation dialog now show the same costs (video 4 credits per second, image 6 credits).","reason":"Verified OK with 202611241937 build.\nThe rules page and the generation dialog now show the same costs (video 4 credits per second, image 6 credits).\nRisk test: n/a"},{"bug":"PHA262026P0142","title":"PHD-A 20.19.0 - [AIAgent] Image_to_Video: Reuse opens Custom without the Image to Video explanation sheet shown elsewhere","creator":"WILLY_WU","severity":"4","images":["screenshots/c_02_p0142_aivideos_entry.png","screenshots/c_07_p0142_reuse_sheet.png","screenshots/c_09_p0142_custom_toast.png"],"result":"OK","summary":"Reuse now shows the Image to Video explanation sheet first, then opens Custom with the reused settings.","reason":"Verified OK with 202611241937 build.\nReuse now shows the Image to Video explanation sheet first, then opens Custom with the reused settings.\nRisk test: n/a"},{"bug":"PHA262026P0145","title":"PHD-A 20.19.0 - [AIAgent][UI] Image_to_Video: Reuse: Custom room flashes rotated (landscape) before settling portrait","creator":"WILLY_WU","severity":"4","images":["recordings/frames-sheets/p0145-reuse-1_native.png","recordings/frames-sheets/p0145-reuse-5-nosheet_native.png"],"result":"OK","summary":"Reuse now opens the Custom room in portrait with no rotated frame during the transition.","reason":"Verified OK with 202611241937 build.\nReuse now opens the Custom room in portrait with no rotated frame during the transition.\nRisk test: n/a"}]};
const KEY = 'qr-review:' + D.tr + ':' + D.build;
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
const store = () => { try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {} };
const $ = s => document.querySelector(s);
const el = (t, a = {}, ...c) => { const n = document.createElement(t); for (const k in a) k === 'class' ? n.className = a[k] : n.setAttribute(k, a[k]); n.append(...c); return n; };
$('#h').textContent = D.tr + ' · QA Report draft · ' + D.build;
if (D.errors.length) $('#errors').append(el('div', { class: 'card errors' }, el('b', {}, 'Check found problems'), el('ul', {}, ...D.errors.map(e => el('li', {}, e)))));
for (const [k, v] of [['Template', D.template], ['Tester', D.tester], ['Short Description', D.shortDescription], ['Test Result', D.testResult],
  D.perBug ? ['Evidence', 'uploaded to each eBug (' + D.rows.filter(r => r.result !== 'Hold').reduce((n, r) => n + r.images.length + (r.logs || []).length, 0) + ' files), named in its Reason']
    : ['Evidence ZIP', D.evidence ? D.evidence.file + ' (' + D.evidence.files + ' files)' : 'not packed yet']]) $('#fields').append(el('dt', {}, k), el('dd', {}, v));
$('#details').textContent = D.details;
const state = r => saved[r.bug] || {};
function counts() {
  const c = { OK: 0, Fail: 0, Hold: 0 };
  for (const r of D.rows) c[state(r).result || r.result]++;
  $('#counts').replaceChildren(...Object.entries(c).map(([k, v]) => el('span', { class: 'pill ' + k }, k + ' ' + v)));
}
for (const r of D.rows) {
  const s = state(r);
  const sel = el('select', { 'aria-label': 'Verdict for ' + r.bug }, ...['OK', 'Fail', 'Hold'].map(v => { const o = el('option', { value: v }, v); if ((s.result || r.result) === v) o.selected = true; return o; }));
  const ta = el('textarea', { 'aria-label': 'Reason for ' + r.bug });
  ta.value = s.reason ?? r.reason;
  const mark = () => ta.classList.toggle('edited', ta.value !== r.reason || sel.value !== r.result);
  sel.onchange = () => { saved[r.bug] = { ...state(r), result: sel.value }; store(); counts(); mark(); };
  ta.oninput = () => { saved[r.bug] = { ...state(r), reason: ta.value }; store(); mark(); };
  const note = el('textarea', { 'aria-label': 'Reviewer note for ' + r.bug, placeholder: 'Reviewer note (optional)', style: 'min-height:40px' });
  note.value = s.note || '';
  note.oninput = () => { saved[r.bug] = { ...state(r), note: note.value }; store(); };
  const imgs = el('div', { class: 'imgs' }, ...r.images.map(src => el('figure', {}, el('img', { src, alt: src, loading: 'lazy' }), el('figcaption', { title: src }, src.split('/').pop()))));
  const meta = [r.creator, r.severity && 'S' + r.severity].filter(Boolean).join(' · ');
  $('#rows').append(el('section', { class: 'card', id: r.bug },
    el('div', { class: 'row-head' }, el('h2', {}, r.bug + ' ', el('span', { class: 'pill ' + r.result }, 'agent: ' + r.result)), sel),
    el('p', {}, r.title + (meta ? ' ' : ''), el('span', { class: 'muted' }, meta)),
    el('p', { class: 'muted' }, r.summary + (r.note ? ' — ' + r.note : '')),
    ta, imgs, el('label', { class: 'note' }, note)));
  mark();
}
counts();
const fit = t => { t.style.height = 'auto'; t.style.height = t.scrollHeight + 4 + 'px'; };
document.querySelectorAll('textarea').forEach(t => { fit(t); t.addEventListener('input', () => fit(t)); });
document.addEventListener('click', e => { if (e.target.matches('.imgs img')) { $('#zoom img').src = e.target.src; $('#zoom').style.display = 'flex'; } });
$('#zoom').onclick = () => { $('#zoom').style.display = 'none'; };
$('#copy').onclick = async () => {
  const out = D.rows.map(r => { const s = state(r); const res = s.result || r.result; const reason = s.reason ?? r.reason;
    return { bug: r.bug, result: res, changed: res !== r.result || reason !== r.reason, ...(reason !== r.reason ? { reason } : {}), ...(s.note ? { note: s.note } : {}) }; });
  const text = 'QR decisions ' + D.tr + ' ' + D.build + '\n' + JSON.stringify(out, null, 1);
  try { await navigator.clipboard.writeText(text); $('#copy').textContent = 'Copied'; } catch (e) { prompt('Copy this', text); }
  setTimeout(() => { $('#copy').textContent = 'Copy decisions'; }, 1500);
};
$('#reset').onclick = () => { if (confirm('Drop every edit on this page?')) { saved = {}; store(); location.reload(); } };
</script>
</body>
</html>
